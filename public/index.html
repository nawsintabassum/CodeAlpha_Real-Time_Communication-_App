<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectMeet - Real-Time Collaboration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-screen" class="screen active">
        <div class="card">
            <h2>ConnectMeet</h2>
            <p id="auth-subtitle">Sign in to your account</p>
            
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Username" required autocomplete="off">
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" id="auth-btn" class="btn primary">Login</button>
            </form>
            
            <p class="toggle-text">
                <span id="auth-toggle-msg">Don't have an account?</span> 
                <a href="#" id="auth-toggle-btn">Register</a>
            </p>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <div id="room-screen" class="screen">
        <div class="card">
            <h2>Join a Meeting</h2>
            <p>Welcome, <b id="display-user">User</b>!</p>
            <form id="room-form">
                <input type="text" id="room-id" placeholder="Enter Room ID (e.g., Room123)" required autocomplete="off">
                <button type="submit" class="btn primary">Enter Room</button>
            </form>
            <button id="logout-btn" class="btn secondary">Logout</button>
        </div>
    </div>

    <div id="meeting-screen" class="screen">
        <header class="top-bar">
            <h3>ConnectMeet Room: <span id="current-room-display"></span></h3>
            <div class="header-actions">
                <button id="toggle-whiteboard-btn" class="btn small">Toggle Whiteboard</button>
                <button id="leave-btn" class="btn danger small">Leave Room</button>
            </div>
        </header>

        <div class="main-content">
            <div class="stage-container">
                <div id="video-grid" class="video-grid">
                    <div class="video-card" id="local-video-card">
                        <video id="local-video" autoplay muted playsinline></video>
                        <span class="video-label" id="local-label">You</span>
                    </div>
                </div>

                <div id="whiteboard-container" class="whiteboard-container hidden">
                    <div class="wb-controls">
                        <label>Color: <input type="color" id="wb-color" value="#000000"></label>
                        <label>Size: <input type="range" id="wb-size" min="1" max="20" value="3"></label>
                        <button id="wb-clear" class="btn small secondary">Clear</button>
                    </div>
                    <canvas id="whiteboard"></canvas>
                </div>
            </div>

            <aside class="sidebar">
                <div class="sidebar-header">
                    <h4>Room Chat & Files</h4>
                </div>
                <div id="chat-messages" class="chat-messages"></div>
                
                <div class="sidebar-footer">
                    <form id="chat-form">
                        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                        <button type="submit" class="btn primary small">Send</button>
                    </form>
                    <div class="file-upload-wrapper">
                        <input type="file" id="file-input" hidden>
                        <button id="file-btn" class="btn secondary small full-width">📎 Send File</button>
                    </div>
                </div>
            </aside>
        </div>

        <footer class="controls-bar">
            <button id="mic-btn" class="btn control-btn">🎤 Mute Mic</button>
            <button id="cam-btn" class="btn control-btn">📷 Turn Off Cam</button>
            <button id="screen-btn" class="btn control-btn">🖥️ Share Screen</button>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
